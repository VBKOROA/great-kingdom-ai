# Evaluation workload
games: 2
batch_size: 2
max_turns: 112
device: cuda
leaf_batch_size: 2048

# Gumbel search
gumbel_simulations: 32
gumbel_max_considered_actions: 4
gumbel_c_visit: 50.0
gumbel_c_scale: 1.0
gumbel_scale: 0.0

# Opening exploration
opening_gumbel_turns: 8
opening_gumbel_scale: 0.0

# Policy target
policy_target_c_visit: 50.0
policy_target_c_scale: 1.0
policy_target_temperature: 1.0

# Fairness and promotion
paired_seeds: true
promotion_threshold: 1.0
require_side_win_rates_for_promotion: true
