# Shared run directory
work_dir: data/runpod/train-strong-attn

# Replay and training cadence
# Unbenchmarked starting point: one actor + learner on a shared RTX 3090.
# Retained training transitions, not games; keep uniform replay reasonably fresh.
replay_capacity: 262144
# 32 training batches at batch_size=512 before the first update.
min_replay_transitions: 16384
# In --loop, each new transition adds four sampled training rows to the budget.
train_reuse_factor: 4.0

# Checkpoint loading and output overrides
source_checkpoint: null
candidate_checkpoint: null
training_latest_checkpoint: null
train_checkpoint_mode: resume

# Actor model export
export_onnx: true
onnx_output_path: data/runpod/train-strong-attn/checkpoints/onnx/training-latest.onnx
onnx_device: cuda
onnx_precision: fp16
onnx_dummy_batch_size: 2
onnx_prefer_ema: false

# EMA model export
export_ema_onnx: true
ema_onnx_output_path: data/runpod/train-strong-attn/checkpoints/onnx/training-latest-ema.onnx

# Disk usage and replay I/O
prune_artifacts: true
prune_keep_imported_shards: 2
replay_save_temp_dir: /tmp/great-kingdom-ai/replay-save
replay_local_dir: /tmp/great-kingdom-ai/train-strong-attn/replay
