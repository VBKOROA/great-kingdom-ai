# Shared run directory and models
work_dir: data/runpod/train-strong-attn
onnx_model_path: data/runpod/train-strong-attn/checkpoints/onnx/training-latest.onnx
ema_onnx_model_path: data/runpod/train-strong-attn/checkpoints/onnx/training-latest-ema.onnx
ema_opponent_fraction: 0.25
model_version: training-latest

# Shard generation
games: 256
seed_start: 0

# ONNX and self-play batching
# Unbenchmarked starting point for RTX 3090 24GB, FP16 strong_attn, and a shared learner.
# With 25% EMA opponents, 256 games run as 192 raw games then 64 mixed games.
onnx_device: cuda
onnx_max_batch_size: 512
rust_self_play_batch_size: 256

self_play:
  # Search budget
  max_turns: 112
  gumbel_simulations: 64
  gumbel_max_considered_actions: 16
  # Per-game pending leaves; favor cross-game batching for 16/64-simulation search.
  leaf_batch_size: 4

  # Gumbel search tuning
  gumbel_c_visit: 50.0
  gumbel_c_scale: 1.0
  gumbel_scale: 1.0
  gumbel_seed: 700000

  # Policy target tuning
  policy_target_c_visit: 50.0
  policy_target_c_scale: 1.0
  policy_target_temperature: 1.0

  # Move sampling
  temperature_turns: 0
  sampling_temperature: 1.0

  # Playout cap randomization
  playout_cap_randomization: true
  playout_cap_full_search_fraction: 0.25
  playout_cap_full_simulations: 64
  playout_cap_fast_simulations: 16
  playout_cap_full_max_considered_actions: 16
  playout_cap_fast_max_considered_actions: 4
