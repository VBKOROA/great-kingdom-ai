# Experiment actor config: separate work directory from train-strong-attn.
work_dir: data/runpod/train-strong-attn-terminal-board
onnx_model_path: data/runpod/train-strong-attn-terminal-board/checkpoints/onnx/training-latest.onnx
ema_onnx_model_path: data/runpod/train-strong-attn-terminal-board/checkpoints/onnx/training-latest-ema.onnx
ema_opponent_fraction: 0.25
model_version: training-latest

# Shard generation
games: 64
seed_start: 0

# ONNX and self-play batching
onnx_device: cuda
onnx_max_batch_size: 1024
rust_self_play_batch_size: 64

self_play:
  max_turns: 112
  gumbel_simulations: 64
  gumbel_max_considered_actions: 16
  leaf_batch_size: 1024

  gumbel_c_visit: 50.0
  gumbel_c_scale: 1.0
  gumbel_scale: 1.0
  gumbel_seed: 700000

  policy_target_c_visit: 50.0
  policy_target_c_scale: 1.0
  policy_target_temperature: 1.0

  temperature_turns: 0
  sampling_temperature: 1.0

  playout_cap_randomization: false
  playout_cap_full_search_fraction: 0.25
  playout_cap_full_simulations: 128
  playout_cap_fast_simulations: 32
  playout_cap_full_max_considered_actions: 8
  playout_cap_fast_max_considered_actions: 4
