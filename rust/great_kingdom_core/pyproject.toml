[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "great-kingdom-core"
version = "0.1.0"
description = "Rust rules engine and Gumbel search core for Great Kingdom AI."
requires-python = ">=3.11"

[tool.maturin]
module-name = "great_kingdom_core"
features = ["extension-module"]
