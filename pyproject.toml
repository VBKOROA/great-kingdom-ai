[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "great-kingdom-ai"
version = "0.1.0"
description = "AlphaZero-lite AI experiments for the Great Kingdom board game."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
]

[project.optional-dependencies]
ai = [
  "torch>=2.6",
]
dev = [
  "maturin>=1.8",
  "mypy>=1.13",
  "onnx>=1.17",
  "onnxruntime>=1.20",
  "pytest>=8.3",
  "ruff>=0.8",
]

[project.scripts]
great-kingdom-play = "great_kingdom_ai.cli:main"
great-kingdom-random-self-play = "great_kingdom_ai.self_play:main"
great-kingdom-train = "great_kingdom_ai.train:main"
great-kingdom-single-batch-overfit = "great_kingdom_ai.single_batch_overfit:main"
great-kingdom-replay-diagnostics = "great_kingdom_ai.replay_diagnostics:main"
great-kingdom-aggregate-replay = "great_kingdom_ai.replay_aggregate:main"
great-kingdom-evaluate = "great_kingdom_ai.evaluate:main"
great-kingdom-pipeline = "great_kingdom_ai.pipeline:main"
great-kingdom-export-onnx = "great_kingdom_ai.onnx_export:main"
great-kingdom-rust-onnx-pipeline = "great_kingdom_ai.rust_onnx_pipeline:main"
great-kingdom-import-legacy-pipeline = "great_kingdom_ai.rust_onnx_replay:main"
great-kingdom-gumbel-ablation = "great_kingdom_ai.gumbel_ablation:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
great_kingdom_ai = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["great_kingdom_ai"]
strict = true
